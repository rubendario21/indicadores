<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores de gestión</title>
<link rel="stylesheet" href="/static/estilos.css">
<script src="/static/vendor/echarts-5.5.1.min.js"></script>
</head>
<body>
<header class="barra">
  <div class="barra-marca">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <div class="barra-titulo">Indicadores de gestión</div>
      <div class="barra-sub" id="empresa">&nbsp;</div>
    </div>
  </div>
  <div class="barra-acciones">
    <label class="selector">Año
      <select id="anio"></select>
    </label>
    <span class="actualizado" id="actualizado" title=""></span>
    <button class="boton boton-claro" id="refrescar" title="Consultar SAP y Zoho de nuevo">
      <span class="icono-refrescar" aria-hidden="true">↻</span> Actualizar
    </button>
    <span class="usuario" id="usuario"></span>
    <a class="boton boton-claro" href="/logout">Salir</a>
  </div>
</header>

<div class="cuerpo">
  <nav class="menu" id="menu" aria-label="Procesos"></nav>
  <main class="contenido" id="contenido">
    <div class="cargando" id="cargando">
      <div class="spinner"></div>
      <p>Consultando SAP y Zoho…</p>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
