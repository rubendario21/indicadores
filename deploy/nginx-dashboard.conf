# /etc/nginx/sites-available/dashboard.peoplecore.com.co
# Activar: ln -s /etc/nginx/sites-available/dashboard.peoplecore.com.co /etc/nginx/sites-enabled/
# HTTPS:   certbot --nginx -d dashboard.peoplecore.com.co   (agrega los bloques ssl automáticamente)

# Máximo 10 intentos de login por minuto por IP
limit_req_zone $binary_remote_addr zone=login_dashboard:10m rate=10r/m;

server {
    listen 80;
    server_name dashboard.peoplecore.com.co;

    client_max_body_size 1m;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /login {
        limit_req zone=login_dashboard burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        alias /opt/indicadores/web/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        # la primera consulta del día a SAP + Zoho puede tardar
        proxy_read_timeout 120s;
    }
}
